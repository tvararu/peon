[tools]
"npm:@biomejs/biome" = "latest"
bun = "latest"
gh = "latest"
hk = "latest"
jq = "latest"
pkl = "latest"

[settings]
npm.package_manager = "bun"

[tasks.bundle]
description = "Install dependencies and local Git hooks"
run = '''
set -e
bun install
hk install --mise
'''

[tasks.test]
description = "Run all tests"
raw = true
run = "bun test"

[tasks."test:coverage"]
description = "Run tests with coverage report"
raw = true
run = "bun test --coverage"

[tasks."test:slowest"]
description = "Show 10 slowest tests"
raw = true
run = '''
bun test --reporter=junit \
  --reporter-outfile=tmp/junit.xml && \
sed -n 's/.*<testcase name="\([^"]*\)".* time="\([^"]*\)".*/\2\t\1/p' \
  tmp/junit.xml | sort -rn | head -10 \
  | awk -F'	' '{printf "%7.1fms  %s\n",$1*1000,$2}'
'''

[tasks.ci]
description = "Run ci:checks, then sign off a clean HEAD as signoff/ci"
usage = '''
flag "--publish" help="Push HEAD to a temporary ref so an unpushed commit can be signed off, and fail if signoff fails"
'''
run = '''
set -eu
head=$(git rev-parse HEAD)
dirty=$(git status --porcelain)
mise run ci:checks
publish=${usage_publish:-false}
if [ -n "$dirty" ] || [ -n "$(git status --porcelain)" ] || [ "$(git rev-parse HEAD)" != "$head" ]; then
  echo "ci: checks passed, but the tree was not a clean HEAD throughout, so signoff/ci was not posted" >&2
  [ "$publish" = true ] && exit 1
  exit 0
fi
if [ "$publish" != true ]; then
  gh signoff ci || echo "ci: checks passed; signoff/ci not posted (HEAD must be pushed to its upstream)" >&2
  exit 0
fi
ref="refs/signoff/$head"
git push -q --no-verify origin "$head:$ref" </dev/null
status=0
gh signoff create -f ci || status=$?
git push -q --no-verify origin ":$ref" </dev/null
exit "$status"
'''

[tasks."ci:checks"]
description = "Run local typecheck, coverage tests, format, lint and docs checks"
depends = ["typecheck", "test:coverage", "format", "lint", "lint:docs"]

[tasks.typecheck]
description = "Type-check the whole repo and each package, or one package"
usage = 'arg "[package]" help="core, factory, devtools or harness; omit to check the repo and every package"'
run = '''
case "${usage_package:-}" in
  "") exec bun run typecheck ;;
  core|factory|devtools|harness) exec bun run tsc --noEmit -p "packages/${usage_package}" ;;
  *) echo "usage: mise typecheck [package]: unknown package '${usage_package}'; valid names: core, factory, devtools, harness" >&2; exit 2 ;;
esac
'''

[tasks.format]
description = "Check formatting"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome format ${usage_path}'

[tasks."format:fix"]
description = "Fix formatting"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome format --write ${usage_path}'

[tasks.lint]
description = "Check lint rules and assist actions"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome check --formatter-enabled=false --error-on-warnings ${usage_path}'

[tasks."lint:fix"]
description = "Apply safe lint fixes and assist actions"
usage = 'arg "[path]" default="packages/" help="a package or file; defaults to every package"'
run = 'biome check --write ${usage_path}'

[tasks."lint:docs"]
description = "Check current docs for dated history and dead references"
run = "bun packages/devtools/src/stale-docs.ts"

[tasks.factory]
description = "Run the dev factory CLI (docs/factory.md); run it bare for its commands"
raw = true
quiet = true
run = "bun packages/factory/src/main.ts"

[tasks.harness]
description = "Run the Pi harness (docs/harness.md); pass harness flags after the task name"
raw = true
quiet = true
run = "bun packages/harness/src/entry.ts"

[tasks.eval]
description = "Run the eval grader CLI (docs/evals.md); run it bare for its commands"
raw = true
quiet = true
run = "bun packages/harness/src/grader/cli.ts"

[tasks."namigator:build"]
description = "Build and install the patched libnamigator.so (vendor/namigator)"
raw = true
run = "bun packages/factory/src/namigator-library.ts"
